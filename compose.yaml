services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - hotel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hotel:${POSTGRES_PASSWORD}@db:5432/hotel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HOTEL_TIMEZONE: Asia/Riyadh
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  hotel_data:
